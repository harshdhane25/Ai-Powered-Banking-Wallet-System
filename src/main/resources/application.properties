spring.application.name=Banking-Wallet-System-Project
server.port=8181

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/banking_wallet_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email Configuration (Replace with your actual Gmail and App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email-@gmail.com
spring.mail.password=ipd-your-password-hlb
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OpenRouter AI Configuration
# Using direct RestTemplate HTTP call (not Spring AI ChatModel) for full OpenRouter compatibility
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=sk-or-v1-your-api-key
# Free model on OpenRouter \u2014 no credits needed
spring.ai.openai.chat.options.model=tencent/hy3-preview:free
spring.ai.openai.chat.options.temperature=0.7